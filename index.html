<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraceBack: A Smart Lost and Found Tracking and Recovery System</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="app-shell">
        <header class="site-header">
            <img class="logo-mark" src="logo.png" alt="TraceBack logo">
            <div>
                <h1>TraceBack</h1>
                <p>A Smart Lost and Found Tracking and Recovery System</p>
            </div>
        </header>

        <main>
            <nav class="toolbar" aria-label="Filter by status">
                <h2>Campus Lost &amp; Found</h2>
                <div class="btn-group">
                    <button data-status="All" aria-pressed="true">All</button>
                    <button data-status="Lost" aria-pressed="false">Lost</button>
                    <button data-status="Found" aria-pressed="false">Found</button>
                    <button data-status="Claimed" aria-pressed="false">Claimed</button>
                </div>
            </nav>

            <div class="filter-bar">
                <div>
                    <p class="filter-label">Category</p>
                    <section class="category-filters" aria-label="Filter by category">
                        <button data-category="All" aria-pressed="true">All</button>
                        <button data-category="Electronics" aria-pressed="false">Electronics</button>
                        <button data-category="Personal Item" aria-pressed="false">Personal Items</button>
                        <button data-category="School Item" aria-pressed="false">School Items</button>
                        <button data-category="Others" aria-pressed="false">Others</button>
                    </section>
                </div>
                <button class="report-button" id="reportItem">+ Report Lost Item</button>
            </div>

            <p class="office-notice">
                Found items are kept at the <strong>Student Assistant Office</strong>.
                Please go there with a valid ID to claim your item.
            </p>

            <p class="results-heading" id="resultsHeading" aria-live="polite"></p>
            <section class="items-grid" id="lostItemsContainer" aria-label="Reported items"></section>

            <dialog id="reportDialog">
                <form class="report-form" id="reportForm" method="dialog">
                    <h2>Report Lost Item</h2>
                    <label>Your Name:
                        <input type="text" name="name" required>
                    </label>
                    <label>Item Name:
                        <input type="text" name="item" required>
                    </label>
                    <label>Category
                        <select name="category" required>
                            <option value="Electronics">Electronics</option>
                            <option value="Personal Item">Personal Item</option>
                            <option value="School Item">School Item</option>
                            <option value="Others">Others</option>
                        </select>
                    </label>
                    <label>Description
                        <textarea name="description" placeholder="Describe your item (e.g. color, brand..)"></textarea>
                    </label>
                    <label>Where did you last see it?
                        <input type="text" name="location">
                    </label>
                    <label>Date Lost
                        <input type="date" id="reportDate" name="dateLost" min="2026-01-01" max="2026-12-31">
                        <small>Only dates in 2026 up to today can be reported.</small>
                    </label>
                    <p id="dateError" class="date-error" role="alert"></p>
                    <label>Photos of the item (optional)
                        <input type="file" id="reportImages" accept="image/*" multiple>
                        <small>You can select up to 5 images (max 5 MB each).</small>
                    </label>
                    <div id="imagePreview" class="image-preview" aria-live="polite"></div>
                    <p id="imageError" class="image-error" role="alert"></p>
                    <div class="dialog-actions">
                        <button type="button" id="cancelReport">Cancel</button>
                        <button type="submit">Submit Report</button>
                    </div>
                </form>
            </dialog>
        </main>
    </div>
</body>

</html>
